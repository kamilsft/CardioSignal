[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiosignal"
version = "0.3.0"
description = "Paired ECG <-> PCG translation models, preprocessing and metrics"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "scipy>=1.11"]

[tool.setuptools]
packages = ["cardiosignal"]
